<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Flor de Partículas Amarillas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      overflow: hidden;
      background-color: #050508;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .instructions {
      position: absolute;
      bottom: 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  <div class="instructions">feliz dia de las flores amarillas, Vi</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = document.documentElement.clientWidth;
    let height = canvas.height = document.documentElement.clientHeight;

    let initialBuildProgress = 0.0005;

    window.addEventListener('resize', () => {
      width = canvas.width = document.documentElement.clientWidth;
      height = canvas.height = document.documentElement.clientHeight;
      init();
    });

    const mouse = { x: null, y: null, radius: 100 };
    
    function registerInput(e) {
      if (e.touches && e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      } else if (e.clientX !== undefined) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      }
      handleUserInteraction();
    }

    window.addEventListener('mousemove', registerInput);
    window.addEventListener('mouseleave', () => {
      mouse.x = null;
      mouse.y = null;
    });

    window.addEventListener('touchmove', registerInput, { passive: true });
    window.addEventListener('touchend', () => {
      mouse.x = null;
      mouse.y = null;
    });

    class Particle {
      constructor(targetX, targetY, color) {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.targetX = targetX;
        this.targetY = targetY;
        
        this.size = Math.random() * 2 + 1;
        this.color = color;
        
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.accX = 0;
        this.accY = 0;
        this.friction = 0.93;
        this.ease = 0.015;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fill();
      }

      update() {
        let dx = this.targetX - this.x;
        let dy = this.targetY - this.y;
        
        let currentEase = Math.min(this.ease, initialBuildProgress);
        this.accX = dx * currentEase;
        this.accY = dy * currentEase;

        if (mouse.x !== null) {
          let mdx = this.x - mouse.x;
          let mdy = this.y - mouse.y;
          let dist = Math.sqrt(mdx * mdx + mdy * mdy);
          
          if (dist < mouse.radius) {
            let force = (mouse.radius - dist) / mouse.radius;
            let angle = Math.atan2(mdy, mdx);
            this.accX += Math.cos(angle) * force * 4;
            this.accY += Math.sin(angle) * force * 4;
          }
        }

        this.vx = (this.vx + this.accX) * this.friction;
        this.vy = (this.vy + this.accY) * this.friction;

        this.x += this.vx;
        this.y += this.vy;
      }
    }

    let particles = [];

    const defaultWordSequence = [
      "Comienza una nueva estación, y con ella te regalo una parte de mí",
      "Si estás leyendo esto, es porque te tomaste el tiempo suficiente con la flor, gracias por eso",
      "Como una flor real, puedes verlo siempre que quieras",
      "Somos complicados, pero lo intentamos",
      "Aunque nos pinchen las espinas",
      "Cuando te sientas mal, ven y riégala",
      "Quizá cambie con el tiempo, igual que nosotros"
    ];

    let activeSequence = [...defaultWordSequence];

    let currentState = 'flower';
    let currentWordIndex = 0;
    let initialTimeLimitSeconds = 30;
    let textDurationSeconds = 7;
    let cooldownSeconds = 3;
    let canInteractToReturn = false;

    let autoTextTimer = null;
    let initialTimer = null;
    let particlePointsFlower = [];

    function generateFlowerPoints() {
      const points = [];
      const centerX = width / 2;
      const centerY = height / 2 - 20;

      for (let i = 0; i < 400; i++) {
        let r = Math.sqrt(Math.random()) * 30;
        let theta = Math.random() * Math.PI * 2;
        points.push({
          x: centerX + r * Math.cos(theta),
          y: centerY + r * Math.sin(theta),
          color: '#ffaa00'
        });
      }

      const numPetals = 8;
      const petalParticles = 2200;

      for (let i = 0; i < petalParticles; i++) {
        let u = Math.random();
        let angle = Math.random() * Math.PI * 2;
        
        let petalShape = Math.abs(Math.cos((numPetals / 2) * angle)) * 140 + 30;
        let r = u * petalShape;

        let px = centerX + r * Math.cos(angle);
        let py = centerY + r * Math.sin(angle);

        let yellowShade = `hsl(${45 + Math.random() * 15}, 100%, ${50 + (r / 170) * 30}%)`;

        points.push({
          x: px,
          y: py,
          color: yellowShade
        });
      }

      for (let i = 0; i < 300; i++) {
        let ty = centerY + 30 + Math.random() * 220;
        let tx = centerX + Math.sin(ty * 0.03) * 10 + (Math.random() - 0.5) * 6;
        points.push({
          x: tx,
          y: ty,
          color: '#4CAF50'
        });
      }

      for (let i = 0; i < 300; i++) {
        let t = Math.random();
        let lx = centerX + (t * 60) + Math.sin(t * Math.PI) * 15;
        let ly = centerY + 120 + (t * 30);
        points.push({
          x: lx,
          y: ly,
          color: '#2E7D32'
        });
      }

      return points;
    }

    function generateTextPoints(text) {
      const offCanvas = document.createElement('canvas');
      const offCtx = offCanvas.getContext('2d');
      offCanvas.width = width;
      offCanvas.height = height;

      const words = text.split(' ');
      const lines = [];
      let currentLine = words[0];

      const maxCharsPerLine = Math.max(12, Math.floor(width / 25));

      for (let i = 1; i < words.length; i++) {
        if ((currentLine + " " + words[i]).length <= maxCharsPerLine) {
          currentLine += " " + words[i];
        } else {
          lines.push(currentLine);
          currentLine = words[i];
        }
      }
      lines.push(currentLine);

      let maxLineLength = Math.max(...lines.map(l => l.length));
      const fontSize = Math.min(width / (maxLineLength * 0.65), height / (lines.length * 2.2), 55);
      const lineHeight = fontSize * 1.25;

      offCtx.font = `bold ${fontSize}px sans-serif`;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillStyle = 'white';

      const startY = (height / 2) - ((lines.length - 1) * lineHeight) / 2;
      lines.forEach((line, index) => {
        offCtx.fillText(line, width / 2, startY + (index * lineHeight));
      });

      const imgData = offCtx.getImageData(0, 0, width, height).data;
      const points = [];
      const step = 4;

      for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
          const index = (y * width + x) * 4;
          if (imgData[index + 3] > 128) {
            points.push({ x, y });
          }
        }
      }
      return points;
    }

    function showText(index) {
      currentState = 'text';
      currentWordIndex = index;
      canInteractToReturn = false;
      
      clearTimeout(autoTextTimer);

      const textPoints = generateTextPoints(activeSequence[currentWordIndex]);

      particles.forEach((p, i) => {
        if (i < textPoints.length) {
          p.targetX = textPoints[i].x;
          p.targetY = textPoints[i].y;
        } else {
          p.targetX = width / 2 + (Math.random() - 0.5) * (width * 0.8);
          p.targetY = height / 2 + (Math.random() - 0.5) * (height * 0.8);
        }
      });

      setTimeout(() => {
        canInteractToReturn = true;
      }, cooldownSeconds * 1000);

      autoTextTimer = setTimeout(() => {
        let nextIndex = currentWordIndex + 1;
        if (nextIndex < activeSequence.length) {
          showText(nextIndex);
        } else {
          transitionToFlower();
        }
      }, textDurationSeconds * 1000);
    }

    function transitionToFlower() {
      currentState = 'flower';
      canInteractToReturn = false;
      clearTimeout(autoTextTimer);

      particles.forEach((p, i) => {
        p.targetX = particlePointsFlower[i].x;
        p.targetY = particlePointsFlower[i].y;
      });

      startInitialTimer();
    }

    function handleUserInteraction() {
      if (currentState === 'text' && canInteractToReturn) {
        transitionToFlower();
      }
    }

    function startInitialTimer() {
      clearTimeout(initialTimer);

      const today = new Date();
      const isExamDay = (today.getDate() === 8 && (today.getMonth() + 1) === 10);

      let delaySeconds = initialTimeLimitSeconds;

      if (isExamDay) {
        delaySeconds = 4;
        activeSequence = ["¡Ánimos en el examen!"];
      } else {
        activeSequence = [...defaultWordSequence];
      }

      initialTimer = setTimeout(() => {
        if (currentState === 'flower') {
          showText(0);
        }
      }, delaySeconds * 1000);
    }

    window.addEventListener('click', handleUserInteraction);

    function init() {
      initialBuildProgress = 0.0005;
      particles = [];
      const points = generateFlowerPoints();
      particlePointsFlower = points;
      points.forEach(pt => {
        particles.push(new Particle(pt.x, pt.y, pt.color));
      });
      transitionToFlower();
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 8, 0.2)';
      ctx.fillRect(0, 0, width, height);

      if (initialBuildProgress < 0.015) {
        initialBuildProgress += 0.00003;
      }

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    init();
    animate();
  </script>
</body>
</html>
